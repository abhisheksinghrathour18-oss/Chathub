services:
  postgres:
    image: postgres:16-alpine
    container_name: chathub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chathub_user
      POSTGRES_PASSWORD: chathub_password
      POSTGRES_DB: chathub_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chathub_user -d chathub_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

